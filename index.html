<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qiaoluo Ren</title>
    <style>
        /* 极简黑白风格设置 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #ffffff; /* 纯白背景 */
            color: #000000; /* 纯黑文字 */
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            
            /* 使用 Flex 布局让内容在屏幕正中央 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: 4px; /* 增加字间距让视觉更透气 */
        }

        p {
            font-size: 1.2rem;
            margin-top: 15px;
            color: #000000;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Qiaoluo Ren</h1>
        <p>music composition</p>
        <p>"Currently dedicated to interdisciplinary research in arts and culture. "
            "I am passionate about exploring the use of logical reasoning 
            to comprehend and create art within the musical domain, 
            excelling at translating abstract thoughts into concrete expressions."</p>
    </div>

</body>
</html>
